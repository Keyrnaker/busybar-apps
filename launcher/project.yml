name: BUSYLauncher
options:
  bundleIdPrefix: com.jhyeup
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_APP_SANDBOX: "NO"
targets:
  BUSYLauncher:
    type: application
    platform: macOS
    sources:
      - path: Sources/BUSYLauncher
        excludes: ["Info.plist"]
      - path: Resources/python
        type: folder
        optional: true
        buildPhase: resources
    info:
      path: Sources/BUSYLauncher/Info.plist
      properties:
        CFBundleName: BUSY Launcher
        CFBundleDisplayName: BUSY Launcher
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_NAME: BUSY Launcher
        PRODUCT_BUNDLE_IDENTIFIER: com.jhyeup.busylauncher
        PRODUCT_MODULE_NAME: BUSYLauncher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
  BUSYLauncherTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BUSYLauncherTests]
    dependencies:
      - target: BUSYLauncher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhyeup.busylauncher.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BUSY Launcher.app/Contents/MacOS/BUSY Launcher"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BUSYLauncher:
    build:
      targets:
        BUSYLauncher: all
        BUSYLauncherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [BUSYLauncherTests]
